<!DOCTYPE html>
<html lang="th">
<head>
  <meta charset="UTF-8">
  <title>Teachable Machine</title>
  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@1.3.1/dist/tf.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@0.8/dist/teachablemachine-image.min.js"></script>
</head>
<body>

  <div id="webcam-container"></div>
  <div id="predictions"></div>

  <script>
    const URL = "https://teachablemachine.withgoogle.com/models/wJvr5MueKZ/";
    let model, webcam;

    // 1. โหลดโมเดล (เมื่อโหลดเสร็จแล้วค่อยทำขั้นตอนถัดไปใน .then)
    tmImage.load(URL + "model.json", URL + "metadata.json").then(function (loadedModel) {
      model = loadedModel;

      // 2. ตั้งค่ากล้อง
      webcam = new tmImage.Webcam(320, 240, true);
      webcam.setup().then(function () {
        webcam.play();
        document.getElementById("webcam-container").appendChild(webcam.canvas);

        // 3. สั่งให้ทำงานฟังก์ชัน loop ทุกๆ 0.1 วินาที (100 มิลลิวินาที)
        setInterval(loop, 100);
      });
    });

    // ฟังก์ชันทำนายภาพปกติ ไม่ต้องมี async/await
    function loop() {
      webcam.update();
      model.predict(webcam.canvas).then(function (prediction) {
        let html = "";
        for (let p of prediction) {
          html += p.className + ": " + Math.round(p.probability * 100) + "%<br>";
        }
        document.getElementById("predictions").innerHTML = html;
      });
    }
  </script>

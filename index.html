<!DOCTYPE html>
<html>
<head>
    <title>โปรเจกต์ AI ของฉัน</title>
</head>
<body>

    <h1>โปรแกรมแยกแยะรูปภาพด้วย AI</h1>

    <!-- 1. แสดงกล้อง -->
    <div id="webcam-container"></div>
    <br>
    
    <!-- 2. แสดงผลลัพธ์ -->
    <div id="label-container" style="font-size: 20px; font-weight: bold;"></div>

    <!-- 3. โหลดเครื่องมือ AI (TensorFlow.js & Teachable Machine Library) -->
    <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@latest/dist/tf.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@teachablemachine/image@latest/dist/teachablemachine-image.min.js"></script>

    <script>
        let model, webcam;

        async function startAI() {
            // 4. โหลดโมเดล AI (เปลี่ยน URL เป็นลิงก์โมเดลของนักเรียน)
            const url = "https://teachablemachine.withgoogle.com/models/wJvr5MueKZ/";
            model = await tmImage.load(url + "model.json", url + "metadata.json");

            // 5. ตั้งค่าและเปิดกล้อง (ขนาดกว้าง 250px, สูง 250px, พลิกหน้ากล้อง)
            webcam = new tmImage.Webcam(250, 250, true);
            await webcam.setup();
            await webcam.play();

            // 6. เอาภาพจากกล้องไปแสดงบนหน้าเว็บ
            document.getElementById("webcam-container").appendChild(webcam.canvas);

            // เริ่มคำนวณผลลัพธ์
            loop();
        }

        // 7. สั่งให้ทำงานซ้ำไปเรื่อยๆ (Loop ทำนายผลทุกเฟรมภาพ)
        async function loop() {
            webcam.update();
            const prediction = await model.predict(webcam.canvas);

            // ดึงชื่อคลาสแรกและเปอร์เซ็นต์มาแสดงผล
            let name = prediction[0].className;
            let percent = Math.round(prediction[0].probability * 100);
            document.getElementById("label-container").innerHTML = "AI มองเห็น: " + name + " (" + percent + "%)";

            window.requestAnimationFrame(loop);
        }

        // 8. สั่งให้เริ่มทำงานทันทีที่เปิดเว็บ
        window.onload = startAI;
    </script>

</body>
</html>
